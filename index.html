<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2dawng Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      scroll-behavior: smooth;
    }
    .hero {
      background: url('https://source.unsplash.com/1600x900/?technology,nature') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    #main-header {
      transition: top 0.3s;
      z-index: 1030;
    }
  </style>
</head>
<body>

  <nav id="main-header" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">2dawng</a>
    </div>
  </nav>

  <header class="hero text-center">
    <h1 class="display-3">Welcome to 2dawng</h1>
  </header>

  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="mb-4">About Me</h2>
      <p>This is a short section about who I am and what I do.</p>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <h2 class="mb-4">Projects</h2>
      <p>Some cool stuff I've worked on like Flask, FastAPI, React apps...</p>
    </div>
  </section>

  <script>
    let lastScrollTop = 0;
    const header = document.getElementById('main-header');

    window.addEventListener('scroll', function () {
      let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      if (scrollTop > lastScrollTop) {
        header.style.top = "-100px"; // scroll down: hide
      } else {
        header.style.top = "0"; // scroll up: show
      }
      lastScrollTop = scrollTop;
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
